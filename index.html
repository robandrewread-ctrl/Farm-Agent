<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Farm app demo</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#E8ECE4;--card:#F8F9F5;--ink:#1D2822;--mute:#5E6B63;--line:#CBD3C8;--steel:#6E7F88;--wheat:#D9A23B;--crop:#3C7A4B;--bad:#B23A30;--warn:#C98A12;--on:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151B17;--card:#1F2823;--ink:#E7ECE4;--mute:#97A39B;--line:#33403A;--steel:#8CA0AB;--crop:#6DB27E;--bad:#E57368;--warn:#E3B04B;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151B17;--card:#1F2823;--ink:#E7ECE4;--mute:#97A39B;--line:#33403A;--steel:#8CA0AB;--crop:#6DB27E;--bad:#E57368;--warn:#E3B04B;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:500 17px/1.35 Barlow,system-ui,sans-serif}
#app{max-width:520px;margin:0 auto;padding:14px 14px 110px}
h1,h2,.num{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;letter-spacing:.01em}
h1{font-size:34px;margin:6px 0 2px}h2{font-size:22px;margin:22px 0 8px}
.sub{color:var(--mute);font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:8px 0}
.row{display:flex;align-items:center;gap:12px}.grow{flex:1;min-width:0}.between{justify-content:space-between}
.btn{min-height:52px;padding:0 18px;border-radius:12px;border:2px solid var(--ink);background:var(--card);color:var(--ink);font:600 17px Barlow,sans-serif;cursor:pointer}
.btn.pri{background:var(--ink);color:var(--bg)}.btn.sm{min-height:44px;padding:0 14px;font-size:15px}
.btn:focus-visible,.tab:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--wheat);outline-offset:2px}
.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.alert{border-left:6px solid var(--warn);padding:10px 12px;margin:6px 0;background:var(--card);border-radius:8px;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.alert.bad{border-left-color:var(--bad)}.alert b{display:block}
.silos{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.silo{text-align:center;background:none;border:0;color:inherit;font:inherit;padding:0;cursor:pointer}
.tube{height:112px;border:2px solid var(--steel);border-radius:10px 10px 4px 4px;background:var(--card);position:relative;overflow:hidden;margin-bottom:4px}
.tube i{position:absolute;left:0;right:0;bottom:0;background:var(--wheat);display:block}
.tube.full i{background:var(--bad)}
.tube span{position:absolute;inset:0;display:grid;place-items:center;font:700 24px 'Barlow Condensed',sans-serif;color:var(--ink);text-shadow:0 0 5px var(--card),0 0 5px var(--card)}
.bar{height:14px;border-radius:7px;background:var(--line);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--crop)}
.bar.low i{background:var(--bad)}.bar.mid i{background:var(--warn)}
.num{font-size:28px}.tag{font-size:14px;padding:3px 9px;border-radius:99px;border:1.5px solid var(--line)}
.tag.bad{border-color:var(--bad);color:var(--bad)}.tag.warn{border-color:var(--warn);color:var(--warn)}.tag.ok{border-color:var(--crop);color:var(--crop)}
.seg{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px}.seg .btn{white-space:nowrap}.seg .on{background:var(--ink);color:var(--bg)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.tab{flex:1;min-width:0;min-height:64px;background:none;border:0;color:var(--mute);font:600 10px Barlow,sans-serif;white-space:nowrap;cursor:pointer;display:grid;place-items:center;gap:0;padding:6px 0}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--ink);box-shadow:inset 0 3px var(--wheat)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9;display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:var(--card);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto}
label{display:block;font-size:15px;color:var(--mute);margin:12px 0 4px}
input,textarea{width:100%;min-height:52px;font:500 20px Barlow,sans-serif;padding:8px 12px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.chat{display:flex;flex-direction:column;gap:8px}.msg{padding:10px 12px;border-radius:12px;max-width:88%}
.msg.me{align-self:flex-end;background:var(--ink);color:var(--bg)}.msg.ai{background:var(--card);border:1px solid var(--line)}
.mic{width:84px;height:84px;border-radius:50%;border:0;background:var(--wheat);color:#1D2822;cursor:pointer;display:grid;place-items:center;margin:14px auto 6px}
.mic svg{width:36px;height:36px;stroke:#1D2822;fill:none;stroke-width:2;stroke-linecap:round}
.mic.rec{background:var(--bad);animation:p 1s infinite}.mic.rec svg{stroke:#fff}
@keyframes p{50%{transform:scale(1.08)}}@media(prefers-reduced-motion:reduce){.mic.rec{animation:none}}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;z-index:20}
.chk{width:34px;height:34px;border-radius:9px;border:2.5px solid var(--ink);background:none;color:var(--ink);font-size:22px;cursor:pointer;flex:none}
.done{text-decoration:line-through;color:var(--mute)}
</style></head><body><div id="app"></div><nav id="nav"></nav><div id="m"></div>
<script>
const $=s=>document.querySelector(s);
const P='Main farm';
const S={tab:'home',sub:'grain',chat:[{ai:1,t:'G’day. Ask about stock, jobs or silos, or tell me what came in. I’ll always check with you before changing anything.'}],rec:0,pend:null,
stock:{
grain:[{id:'s1',name:'Silo 1',sub:'Wheat',unit:'t',cur:92,cap:100},{id:'s2',name:'Silo 2',sub:'Barley',unit:'t',cur:41,cap:80},{id:'s3',name:'Silo 3',sub:'Canola',unit:'t',cur:18,cap:60},{id:'s4',name:'Silo 4',sub:'Lupins',unit:'t',cur:57,cap:60}],
fuel:[{id:'f1',name:'Diesel',sub:'Main tank',unit:'L',cur:6400,cap:20000},{id:'f2',name:'ULP',sub:'Shed tank',unit:'L',cur:620,cap:1000},{id:'f3',name:'AdBlue',sub:'Pallet tank',unit:'L',cur:900,cap:1000}],
fert:[{id:'x1',name:'Urea',sub:'Fertiliser shed',unit:'t',cur:6,min:10},{id:'x2',name:'MAP',sub:'Fertiliser shed',unit:'t',cur:22,min:8}],
chem:[{id:'c1',name:'Glyphosate 450',sub:'Chemical shed',unit:'L',cur:340,min:400},{id:'c2',name:'Trifluralin',sub:'Chemical shed',unit:'L',cur:900,min:300}]},
eq:[{id:'e1',name:'John Deere 8R',sub:'Tractor',u:'hrs',cur:4244,next:4250,int:250,st:''},{id:'e2',name:'Case IH Header',sub:'Harvester',u:'hrs',cur:1790,next:1900,int:250,st:''},{id:'e3',name:'Hilux',sub:'Ute',u:'km',cur:98400,next:100000,int:10000,st:''},{id:'e4',name:'Generator',sub:'Workshop',u:'hrs',cur:612,next:600,int:200,st:''}],
tasks:[{id:1,t:'Grease header',who:'Sam',due:'Today',done:0},{id:2,t:'Check bore pump',who:'You',due:'Overdue',done:0},{id:3,t:'Move canola to Silo 3',who:'Jo',due:'Today',done:0},{id:4,t:'Service quad bike',who:'Sam',due:'Tomorrow',done:0}],
shop:[{id:1,t:'Fuel filters',qty:'2',sup:'Machinery dealer',cost:140,got:0,by:'You',pn:'RE504836',cat:'Parts',s:'Ready to collect'},{id:2,t:'Hydraulic hose 3/4"',qty:'1',sup:'Machinery dealer',cost:85,got:0,by:'Sam',flag:1},{id:3,t:'Glyphosate 450',qty:'200 L',sup:'Rural supplies',cost:1900,got:0,by:'You',cat:'Chemicals',s:'Ordered'},{id:4,t:'Grease cartridges',qty:'12',sup:'Rural supplies',cost:96,got:0,by:'Jo'},{id:5,t:'Star pickets',qty:'20',sup:'Hardware store',cost:180,got:0,by:'Sam'}]};
S.ev=[{id:1,d:21,type:'Delivery',t:'Diesel',sup:'Fuel supplier',qty:5000,unit:'L',item:'f1',loc:'Fuel storage area',time:'8:00 am',state:''},{id:2,d:24,type:'Delivery',t:'Urea',sup:'Rural supplies',qty:10,unit:'t',item:'x1',loc:'Fertiliser shed',time:'10:00 am',state:''},{id:3,d:26,type:'Delivery',t:'Glyphosate 450',sup:'Rural supplies',qty:200,unit:'L',item:'c1',loc:'Chemical shed',time:'2:00 pm',state:''},{id:4,d:23,type:'Servicing',t:'Generator service',state:''},{id:5,d:22,type:'Jobs',t:'Grease header',state:''},{id:6,d:25,type:'Jobs',t:'Contractor visit: bore pump',state:''}];
S.hist={f1:[{d:'3 Nov',qty:6000,sup:'Fuel supplier',price:9840,by:'Sam',rec:''},{d:'14 Oct',qty:5000,sup:'Fuel supplier',price:8300,by:'You',rec:''}]};
S.setup={fuel:1,grain:1,fert:1,chem:1,eq:1,loc:0,wk:0};S.lists={loc:[],wk:[]};
const SU=[['fuel','Fuel storage','Tank name','Capacity (L)'],['grain','Grain storage','Silo name','Capacity (t)'],['fert','Fertiliser','Product','Quantity on hand (t)'],['chem','Chemicals','Product','Quantity on hand (L)'],['eq','Equipment','Machine name','Current hours'],['loc','Storage locations','Location name',''],['wk','Workers','Worker name','']];
const flag=e=>e.type==='Delivery'&&!e.state&&e.d<22;
const findAny=id=>ALLK().flatMap(k=>S.stock[k]).find(i=>i.id===id);
function setup(){const n=Object.values(S.setup).filter(Boolean).length;return `<div class='row between'><h1>Farm setup</h1><button class='btn sm' data-a='goto' data-v='home'>Home</button></div><div class='sub'>${n} of ${SU.length} done. Progress is saved. Do them in any order.</div><div class='bar'><i style='width:${n/SU.length*100}%'></i></div>`+SU.map(c=>`<div class='card'><div class='row between'><b>${c[1]}</b><span class='tag ${S.setup[c[0]]?'ok':'warn'}'>${S.setup[c[0]]?'Done':'To do'}</span></div>${(S.lists[c[0]]||[]).length?`<div class='sub'>${S.lists[c[0]].join(', ')}</div>`:''}<button class='btn sm ${S.setup[c[0]]?'':'pri'}' style='margin-top:10px' data-a='setupadd' data-v='${c[0]}'>${S.setup[c[0]]?'Add another':'Start'}</button></div>`).join('')}
function evCard(e){return `<div class='card' style='border-left:8px solid ${e.c||'var(--line)'}'><div class='row between'><b>${e.t}${e.qty?' \u00b7 '+fmt(e.qty)+' '+e.unit:''}</b><span class='tag ${e.state==='Received'?'ok':flag(e)?'bad':''}'>${e.state||(flag(e)?'Check it':e.type)}</span></div><div class='sub'>${e.d} Nov${e.time?' \u00b7 '+e.time:''}${e.sup?' \u00b7 '+e.sup:''}${e.loc?' \u00b7 '+e.loc:''}</div>${flag(e)?`<div class='sub' style='color:var(--bad)'>Not marked received yet. Did it arrive?</div>`:''}${e.type==='Delivery'&&!e.state&&can('cal')?`<div class='row' style='margin-top:10px;flex-wrap:wrap'><button class='btn sm pri' data-a='recv' data-id='${e.id}'>Mark received</button><button class='btn sm' data-a='chd' data-id='${e.id}'>Change date</button><button class='btn sm' data-a='cxl' data-id='${e.id}'>Cancel</button></div>`:''}${can('cal')?`<div class='row' style='margin-top:8px'><button class='btn sm' data-a='evdel' data-id='${e.id}'>Remove</button></div>`:''}</div>`}
function cal(){const T=22,f=S.cf||'All',sel=S.cd||T,evs=S.ev.filter(e=>(f==='All'||e.type===f)&&e.state!=='Cancelled'),fl=evs.filter(flag),day=evs.filter(e=>e.d===sel);
const grid=['S','M','T','W','T','F','S'].map(x=>`<div class='sub' style='text-align:center'>${x}</div>`).join('')+Array.from({length:30},(_,i)=>{const d=i+1,l=evs.filter(e=>e.d===d);return `<button class='btn sm ${d===sel?'pri':''}' style='padding:0;min-height:48px;${d===T?'border-width:4px':''}' data-a='calday' data-v='${d}' aria-label='${d} November'>${d}${l.length?`<span style='display:flex;justify-content:center;gap:2px;margin-top:2px'>${l.slice(0,3).map(x=>`<i style='display:block;width:7px;height:7px;border-radius:50%;background:${flag(x)?'var(--bad)':(x.c||'var(--wheat)')}'></i>`).join('')}</span>`:''}</button>`}).join('');
return `<div class='row between'><h1>Calendar</h1><div class='row'>${can('cal')?`<button class='btn pri sm' data-a='evadd'>Add event</button>`:''}<button class='btn sm' data-a='goto' data-v='home'>Home</button></div></div><div class='seg'>${['All','Delivery','Servicing','Jobs','Other'].map(x=>`<button class='btn sm ${x===f?'on':''}' data-a='calf' data-v='${x}'>${x==='Delivery'?'Deliveries':x}</button>`).join('')}</div>${fl.length?`<h2>Needs checking</h2>`+fl.map(evCard).join(''):''}<h2>November 2026</h2><div style='display:grid;grid-template-columns:repeat(7,1fr);gap:4px'>${grid}</div><h2>${sel} November${sel===T?' (today)':''}</h2>${day.length?day.map(evCard).join(''):`<div class='card sub'>Nothing on this day.</div>`}${can('cal')?`<button class='btn' style='width:100%;margin-top:8px' data-a='evadd' data-v='${sel}'>+ Add event on ${sel} Nov</button>`:''}`}
S.me='you';S.act=['Sam: Diesel −200 L','Jo: Silo 3 +10 t'];
const PL=[['stock','Update stock'],['tasks','Create jobs'],['shop','Add to shopping list without review'],['sens','See fuel and chemicals'],['cal','Edit calendar']];
const PR={Manager:{stock:1,tasks:1,shop:1,sens:1,cal:1},Worker:{stock:1,tasks:1,shop:0,sens:0,cal:0},'Read-only':{stock:0,tasks:0,shop:0,sens:0,cal:0}};
S.people=[{id:'you',n:'You',role:'Owner',st:'Active',p:{}},{id:'jo',n:'Jo',role:'Manager',st:'Active',p:{...PR.Manager}},{id:'sam',n:'Sam',role:'Worker',st:'Active',p:{...PR.Worker}},{id:'dee',n:'Dee',role:'Worker',st:'Pending',p:{...PR['Read-only']}}];
const me=()=>S.people.find(x=>x.id===S.me),can=p=>S.me==='you'||!!me().p[p],who=()=>me().n;
function team(){const pend=S.people.filter(x=>x.st==='Pending'),act=S.people.filter(x=>x.st!=='Pending');return `<div class='row between'><h1>Team</h1><button class='btn pri sm' data-a='invite'>Invite</button></div><div class='sub'>You control who joins, what they see and what they can change.</div>${pend.length?`<h2>Waiting for approval</h2>`+pend.map(x=>`<div class='card'><b>${x.n}</b> <span class='sub'>joined with your invite code</span><div class='row' style='margin-top:10px'><button class='btn sm pri' data-a='appr' data-id='${x.id}'>Approve</button><button class='btn sm' data-a='rej' data-id='${x.id}'>Decline</button></div></div>`).join(''):''}<h2>People</h2>`+act.map(x=>{const ed=x.id!=='you'&&x.st!=='Revoked';return `<div class='card'><div class='row between'><div class='grow'><b>${x.n}</b><div class='sub'>${x.st==='Revoked'?'Access revoked. Past records kept.':x.role}</div></div>${ed?`<button class='btn sm' data-a='role' data-id='${x.id}'>${x.role}</button>`:''}</div>${ed?PL.map(p=>`<div class='row between' style='margin-top:8px'><span>${p[1]}</span><button class='btn sm' style='min-width:64px;${x.p[p[0]]?'background:var(--ink);color:var(--bg)':''}' data-a='perm' data-id='${x.id}' data-v='${p[0]}' aria-pressed='${!!x.p[p[0]]}'>${x.p[p[0]]?'On':'Off'}</button></div>`).join('')+`<div class='sub' style='margin-top:12px'>Properties</div>`+S.props.map(pn=>`<div class='row between' style='margin-top:6px'><span>${pn}</span><button class='btn sm' style='min-width:64px;${x.props.includes(pn)?'background:var(--ink);color:var(--bg)':''}' data-a='pprop' data-id='${x.id}' data-v='${pn}'>${x.props.includes(pn)?'On':'Off'}</button></div>`).join('')+`<div class='row' style='margin-top:12px'><button class='btn sm pri' data-a='me' data-v='${x.id}'>View app as ${x.n}</button><button class='btn sm' data-a='rev' data-id='${x.id}'>Revoke</button></div>`:''}</div>`}).join('')+`<h2>Recent activity</h2>`+S.act.slice(0,6).map(a=>`<div class='card sub'>${a}</div>`).join('')+`<button class='btn' style='width:100%;margin-top:12px' data-a='goto' data-v='home'>Back to Home</button>`}
S.props=['Home block','North block'];S.pf='All';
S.people.forEach(x=>x.props=(x.id==='sam'||x.id==='dee')?['Home block']:['Home block','North block']);
S.stock.grain.push({id:'n1',name:'Silo N1',sub:'Wheat',unit:'t',cur:12,cap:60,pr:'North block'});S.stock.fuel.push({id:'nf1',name:'Diesel',sub:'North shed',unit:'L',cur:900,cap:5000,pr:'North block'});S.eq.push({id:'ne1',name:'Quad bike',sub:'North block',u:'hrs',cur:880,next:900,int:100,st:'',pr:'North block'});S.tasks.push({id:9,t:'Check North dam pump',who:'Jo',due:'Today',done:0,pr:'North block'});
const pr=i=>i.pr||'Home block',V=a=>a.filter(i=>(S.pf==='All'||pr(i)===S.pf)&&(S.me==='you'||me().props.includes(pr(i)))),canOrder=()=>S.me==='you'||me().role==='Manager';
function propBar(){const ps=S.me==='you'?S.props:S.props.filter(p=>me().props.includes(p));return `<div class='seg'><button class='btn sm ${S.pf==='All'?'on':''}' data-a='pf' data-v='All'>All</button>${ps.map(p=>`<button class='btn sm ${S.pf===p?'on':''}' data-a='pf' data-v='${p}'>${p}</button>`).join('')}${S.me==='you'?`<button class='btn sm' data-a='newprop'>+ Property</button>`:''}</div>`}
const RN=['Stock','Fuel','Grain','Purchases','Equipment','Jobs','Deliveries'];
const bar=(p,c)=>`<div class='bar ${c||''}'><i style='width:${Math.min(100,p)}%'></i></div>`,sens=it=>S.stock.fuel.includes(it)||S.stock.chem.includes(it),vis=i=>S.me==='you'||me().props.includes(pr(i));
function report(){const r=S.rp||'Stock',M=(S.rm||'month')==='month';let b='';
if(r==='Stock'){b=S.cats.filter(c=>can('sens')||!['fuel','chem'].includes(c[0])).map(c=>`<h2>${c[1]}</h2>`+(V(S.stock[c[0]]).map(i=>`<div class='card'><div class='row between'><b>${i.name} <span class='sub'>${i.sub}</span></b><span class='num'>${fmt(i.cur)} ${i.unit}</span></div>${i.cap?bar(pct(i),lvl(i,c[0])==='bad'?'low':''):''}</div>`).join('')||`<div class='card sub'>Nothing here.</div>`)).join('')}
if(r==='Fuel'){if(!can('sens'))b=`<div class='card sub'>You don’t have access to fuel records.</div>`;else{const l=V(S.stock.fuel);b=`<div class='card'><span class='num'>${fmt(l.reduce((a,i)=>a+i.cur,0))} L</span><div class='sub'>on hand across ${l.length} tanks</div></div>`+l.map(i=>`<div class='card'><div class='row between'><b>${i.name} <span class='sub'>${i.sub}</span></b><span>${pct(i)}%</span></div>${bar(pct(i),lvl(i,'fuel')==='bad'?'low':'')}<div class='sub'>${fmt(i.cur)} of ${fmt(i.cap)} L</div></div>`).join('')}}
if(r==='Grain'){const l=V(S.stock.grain);b=`<div class='card'><span class='num'>${l.reduce((a,i)=>a+i.cur,0)} t</span><div class='sub'>stored of ${l.reduce((a,i)=>a+i.cap,0)} t capacity</div></div>`+l.map(i=>`<div class='card'><div class='row between'><b>${i.name} · ${i.sub}</b><span>${pct(i)}%</span></div>${bar(pct(i),pct(i)>=90?'low':'')}</div>`).join('')}

else if(a==='evsave'){const m=S.m,d=parseInt($('#ed').value);if(!(d>=1&&d<=30))return toast('Enter a day from 1 to 30');const e={id:Date.now(),d,type:m.type,c:m.c||'#3A7CA5',state:'',time:$('#etm').value.trim()};if(m.type==='Delivery'){const it=findAny(m.item),q=parseFloat($('#eq').value);if(!it||!(q>0))return toast('Pick a product and enter the quantity');Object.assign(e,{t:it.name,sup:$('#es').value.trim()||'Supplier',qty:q,unit:it.unit,item:it.id,loc:it.sub})}else{const t=$('#et').value.trim();if(!t)return toast('Enter what it is');e.t=t}S.ev.push(e);S.cd=d;sheet('');render();toast('Added to calendar')}
else if(a==='evdel'){S.undo=S.ev.find(x=>x.id==id);S.ev=S.ev.filter(x=>x.id!=id);render();const d=document.createElement('div');d.className='toast';d.dataset.a='evundo';d.style.cursor='pointer';d.textContent='Event removed. Tap to undo.';document.body.append(d);setTimeout(()=>d.remove(),5000)}
else if(a==='evundo'){if(S.undo){S.ev.push(S.undo);S.undo=null;b.remove();render();toast('Event restored')}}
else if(a==='nopen'){S.tab=b.dataset.tab;if(b.dataset.d)S.cd=+b.dataset.d;S.pf='All';render();scrollTo(0,0)}
else if(a==='nxd'){S.gone.add(id);render()}
else if(a==='newtype'){S.m={u:'t'};sheet(`<h2 style='margin-top:0'>New stock type</h2><div class='sub'>For example livestock feed, vet supplies, tyres or fencing.</div><label for='n'>Name</label><input id='n'><label>Counted in</label><div class='seg'>${['t','kg','L','units'].map(u=>`<button class='btn sm ${u==='t'?'on':''}' data-a='nu' data-v='${u}'>${u}</button>`).join('')}</div><div class='row' style='margin-top:16px'><button class='btn pri grow' data-a='ntsave'>Create</button><button class='btn' data-a='close2'>Cancel</button></div>`)}
else if(a==='nu'){S.m.u=v;b.parentElement.querySelectorAll('.btn').forEach(x=>x.classList.toggle('on',x===b))}
else if(a==='ntsave'){const n=$('#n').value.trim();if(!n)return toast('Enter a name');const key='c'+Date.now();S.cats.push([key,n,S.m.u]);S.stock[key]=[];SU.push([key,n,'Product name','Quantity on hand ('+S.m.u+')']);S.setup[key]=0;S.sub=key;sheet('');render();toast(n+' added. Add its first product below.')}
else if(a==='stkview'){S.sub=v;S.tab='stock';render();scrollTo(0,0)}
else if(a==='cat'){S.m.cat=v;document.querySelectorAll('.sheet .seg .btn').forEach(x=>x.classList.toggle('on',x===b))}
else if(a==='shopok'){S.shop.find(x=>x.id==id).flag=0;render();toast('Approved')}
else if(a==='shopadd'){S.m={cat:'Parts',ph:''};sheet(`<h2 style="margin-top:0">Add a part</h2><label for="n">Item</label><input id="n"><label for="qy">Quantity</label><input id="qy" value="1"><label>Type</label><div class="seg">${['Parts','Chemicals','Fertiliser','Fuel','Other'].map(c=>`<button class="btn sm ${c==='Parts'?'on':''}" data-a="cat" data-v="${c}">${c}</button>`).join('')}</div><label for="su">Supplier</label><input id="su" value="Rural supplies"><label for="pn">Part number (optional)</label><input id="pn"><label for="co">Estimated cost ($)</label><input id="co" type="number" inputmode="decimal"><label for="ph">Photo (optional)</label><input id="ph" type="file" accept="image/*" capture="environment"><div class="row" style="margin-top:16px"><button class="btn pri grow" data-a="shopsave">Add item</button><button class="btn" data-a="close2">Cancel</button></div>`)}
else if(a==='shopsave'){const n=$('#n').value.trim();if(!n)return toast('Enter an item');S.shop.push({id:Date.now(),t:n,qty:$('#qy').value||'1',sup:$('#su').value||'To be confirmed',cost:parseFloat($('#co').value)||0,pn:$('#pn').value.trim(),cat:S.m.cat,ph:S.m.ph,got:0,by:who(),flag:can('shop')?0:1});sheet('');render();toast('Added')}
else if(a==='ok'){if(S.pend.shop){S.shop.push({id:Date.now(),...S.pend.shop,cost:0,got:0,by:'You (via AI)'});S.chat.push({ai:1,t:'Added to the shopping list. Recorded: requested and approved by You. It’s under “To be confirmed” until you pick a supplier.'});S.pend=null;render();return}apply(S.pend.it,'add',S.pend.n);S.chat.push({ai:1,t:'Done. '+S.pend.it.name+' is now '+fmt(S.pend.it.cur)+' '+S.pend.it.unit+'. Recorded: requested and approved by You.'});S.pend=null;render()}
else if(a==='no'){S.pend=null;S.chat.push({ai:1,t:'Cancelled. Nothing was changed.'});render()}
});
document.addEventListener('change',e=>{if((e.target.id==='dp'||e.target.id==='dpc')&&e.target.files[0]){const f=new FileReader(),fl=e.target.files[0];f.onload=()=>{S.m.dp=f.result;const p=$('#dpp');if(p)p.innerHTML=f.result.startsWith('data:image')?`<img src='${f.result}' alt='Attached photo' style='width:100%;max-height:180px;object-fit:contain;border-radius:8px'>`:'Attached: '+fl.name;toast('Attached')};f.readAsDataURL(fl)}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.a==='item')e.target.click()});
document.addEventListener('input',e=>{if(e.target.id==='cbg'||e.target.id==='cink'){S.th.preset='Custom';S.th.bg=$('#cbg').value;S.th.ink=$('#cink').value;applyTheme();$('#tc').textContent=ctxt()}});
document.addEventListener('input',e=>{if(e.target.id==='cacc'){S.th.acc=e.target.value;applyTheme()}});
document.addEventListener('input',e=>{if(e.target.id==='sq')$('#sr').innerHTML=srHtml(e.target.value)});
document.addEventListener('change',e=>{if(e.target.id==='rp'&&e.target.files[0]){const f=new FileReader();f.onload=()=>{S.m.rp=f.result;toast('Receipt attached')};f.readAsDataURL(e.target.files[0])}});
document.addEventListener('change',e=>{if(e.target.id==='sp'&&e.target.files[0]){const s={fuel:'Diesel tank 2',grain:'Silo 5',fert:'DAP',chem:'Clethodim',eq:'Kubota quad bike',loc:'Workshop',wk:'New worker'}[S.m.k];if(!$('#sn').value)$('#sn').value=s;$('#sh').textContent='AI suggestion. Please check before saving.'}});
document.addEventListener('change',e=>{if(e.target.id==='ph'&&e.target.files[0]){const f=new FileReader();f.onload=()=>{S.m.ph=f.result;toast('Photo attached')};f.readAsDataURL(e.target.files[0])}});
S.th={mode:'auto',preset:'Paddock'};try{const s=JSON.parse(localStorage.getItem('farmTheme')||'null');if(s&&s.mode)S.th=s}catch(e){}applyTheme();
if(!loadDemo())ALLK().forEach(k=>S.stock[k].forEach(i=>lvl(i,k)==='bad'&&notify(i,k,1)));
render();
</script></body></html>
